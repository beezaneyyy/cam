[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airframe"
version = "1.0.0"
description = "Hand tracking visual experience: draw virtual frames with your fingers and apply real-time effects."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "mediapipe>=0.10.20,<2",
    "opencv-contrib-python>=4.10",
    "numpy>=1.26",
    "pygame-ce>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
airframe = "airframe.__main__:main"

[tool.setuptools.packages.find]
include = ["airframe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
